# PostgreSQL Configuration
db.url=jdbc:postgresql://localhost:5432/ftpproto_db
db.username=smartshop
db.password=smartshop_password
db.driverClassName=org.postgresql.Driver

# MySQL Alternative Example (Uncomment để dùng):
# db.url=jdbc:mysql://localhost:3306/ftpproto_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# db.username=root
# db.password=root123
# db.driverClassName=com.mysql.cj.jdbc.Driver

# Connection Pool Settings
db.poolName=FTPprotoHikariPool
db.maximumPoolSize=10
db.minimumIdle=2
db.idleTimeout=30000
db.connectionTimeout=10000
db.maxLifetime=1800000
